<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Tesla sign-in · charge-line</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>Tesla sign-in</h1>
  <p class="lede">OAuth redirect for charge-line. This page only reads the code from the address bar;
  it sends nothing anywhere.</p>
  <div id="result"><p>No authorisation code in this URL.</p></div>
  <footer><a href="/">charge-line</a></footer>
</main>
<script>
  // Fallback for when Tesla won't redirect to http://localhost: show the code so it can be passed
  // to `npm run cli -- login --code <code>`. The code is single use and useless without the app's
  // client secret.
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  const error = params.get("error");
  const result = document.getElementById("result");
  if (error) {
    result.replaceChildren(Object.assign(document.createElement("p"), {
      textContent: `Tesla returned an error: ${error} ${params.get("error_description") ?? ""}`,
    }));
  } else if (code) {
    const command = `npm run cli -- login --code ${code}`;
    const intro = Object.assign(document.createElement("p"), { textContent: "Run this in poc/tesla-send-route:" });
    const pre = document.createElement("pre");
    pre.textContent = command;
    const copy = Object.assign(document.createElement("button"), { type: "button", textContent: "Copy" });
    copy.addEventListener("click", async () => {
      await navigator.clipboard.writeText(command);
      copy.textContent = "Copied";
    });
    result.replaceChildren(intro, pre, copy);
  }
</script>
</body>
</html>
